name: Build TradingView Desktop
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Pake CLI
        run: npm install -g pake-cli
      - name: Build app
        run: |
          pake "https://cn.tradingview.com" --name "TradingView" --width 1280 --height 800
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradingView-windows
          path: "*.msi"
